x-coverage:
  state: covered
  reason: partial_probe_block
  detail: >-
    Harvard was probed on 2026-08-19 and the profile is complete for every machine surface,
    but two blocks limited what could be read and both are about the fetcher, not about
    Harvard's footprint. First, the entire harvard.edu Drupal estate sits behind Akamai and
    returns a bare "Access Denied" 403 to every non-browser client regardless of User-Agent
    or header set - data.harvard.edu, huit.harvard.edu, provost.harvard.edu,
    scholar.harvard.edu, accessibility.harvard.edu and ai.harvard.edu all behave identically.
    These sites are live to a human browser, so the two data.harvard.edu developer pointers
    the June 2026 profile carried were NOT removed as dead; they were dropped because their
    content could not be read and therefore could not be honestly typed. Second, and more
    interestingly, the two research repositories invert the usual pattern: dash.harvard.edu
    and dataverse.harvard.edu serve a "Human Verification" challenge (405 and 202) on their
    HTML surfaces while their API and OAI-PMH paths return 200 to anonymous machine clients.
    Harvard blocks agents at the front door and lets them in at the side door. Everything
    else resolved: the HUIT API Portal is gated behind HarvardKey by design (its catalog
    paths return an Angular shell to anonymous callers), and api.perma.cc is behind a
    Cloudflare interstitial, so both are recorded as surfaces with the gate named rather
    than guessed at.
  evidence:
    - url: https://dataverse.harvard.edu/openapi
      status: 200
    - url: https://dataverse.harvard.edu/api/info/version
      status: 200
    - url: https://dataverse.harvard.edu/oai?verb=Identify
      status: 200
    - url: https://dataverse.harvard.edu/
      status: 202
      note: Human Verification challenge page on the HTML surface while the API is open.
    - url: https://api.lib.harvard.edu/v2/items.json?title=chess&limit=1
      status: 200
    - url: https://api.harvardartmuseums.org/object?size=1
      status: 401
    - url: https://mdq.incommon.org/entities/https%3A%2F%2Ffed.huit.harvard.edu%2Fidp%2Fshibboleth
      status: 200
    - url: https://harvard-lil.github.io/lawskills-hub/actions/openapi.yaml
      status: 200
    - url: https://dash.harvard.edu/server/oai/request?verb=Identify
      status: 200
    - url: https://dash.harvard.edu/
      status: 405
      note: Human Verification challenge on the HTML surface of the DASH repository.
    - url: https://portal.apis.huit.harvard.edu/apis
      status: 200
      note: Angular shell; catalog data paths return the same shell or 404 without HarvardKey.
    - url: https://data.harvard.edu/
      status: 403
      note: Akamai Access Denied. Live to a browser, unreadable to any automated client.
    - url: https://api.perma.cc/v1/public/archives/?limit=1
      status: 403
      note: Cloudflare interstitial. Surface is live; contents were not readable.
    - url: https://static.case.law/
      status: 200
