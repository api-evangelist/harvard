aid: harvard
name: Harvard University
description: >-
  Harvard University (Cambridge, Massachusetts; founded 1636; private, Ivy League) is one of
  the few institutions in this cohort with a genuinely institution-operated programmable
  footprint rather than a borrowed one. Five surfaces are Harvard's own: the Harvard Dataverse
  research data repository, which runs on Harvard's own infrastructure and whose Dataverse
  software is written by Harvard's Institute for Quantitative Social Science and serves a live
  450-path OpenAPI; the Harvard Library LibraryCloud open metadata API, unauthenticated over
  12M+ bibliographic records; the Harvard Art Museums collections API; a Shibboleth identity
  provider registered in the InCommon federation with REFEDS SIRTFI assurance; and two Harvard
  Law School Library Innovation Lab surfaces, the Caselaw Access Project static bulk data and
  a 2026 OpenAPI 3.1 agent-skills hub. Alongside them sit five vendor tenancies that are just
  as real and are recorded as such rather than credited to Harvard: DASH runs on 4Science's
  managed DSpace behind a harvard.edu hostname, the HOLLIS catalog is an Ex Libris Primo VE
  instance, harvard.figshare.com is a Figshare tenancy, canvas.harvard.edu is an Instructure
  tenancy, and harvard.zoom.us is a Zoom tenancy. There is no unified developer program: the
  central HUIT API Portal exists but its catalog, its base URLs and its credentials all sit
  behind HarvardKey, and the whole harvard.edu Drupal estate answers automated clients with an
  Akamai 403.
