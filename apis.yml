- aid: harvard:canvas
  name: Canvas LMS tenancy (Instructure)
  x-operator: tenant
  x-tenant-of: Instructure
  description: >-
    canvas.harvard.edu CNAMEs to harvard-vanity.instructure.com. The Canvas REST API is live on that hostname
