- aid: harvard:dash
  name: Harvard DASH institutional repository (4Science-managed DSpace)
  x-operator: tenant
  x-tenant-of: 4Science
  description: >-
    DASH (Digital Access to Scholarship at Harvard) is Harvard's open-access institutional repository
    of 58,000+ scholarly works, exposing an open OAI-PMH 2.0 endpoint and a DSpace 7 HAL REST API. TENANT,
    NOT INSTITUTION, and the DNS is what settles it: dash.harvard.edu is a CNAME to dash.lib.harvard.edu,
    which is a CNAME to harvard-dash.prod.4science.cloud, a 4Science-managed DSpace installation. This
    is the scholarbank.nus.edu.sg pattern - a hostname on the institution's own domain that resolves onto
    a vendor platform. The content, the collections and the Harvard DASH repository identifier are genuinely
    Harvard's; the REST contract is DSpace's and the operations are 4Science's. The relationship is recorded
    as a real institutional fact; no DSpace contract is saved under Harvard's slug.
  humanURL: https://library.harvard.edu/services-tools/dash
  baseURL: https://dash.harvard.edu/server/oai/request
  tags:
  - Research Repository
  - Open Access
  - OAI-PMH
  - DSpace
  - Tenant
  properties:
  - type: Documentation
    url: https://library.harvard.edu/services-tools/dash
  - type: Examples
    url: examples/harvard-dash-oai-identify.xml
