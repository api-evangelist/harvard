- aid: harvard:api-portal
  name: Harvard API Portal (HUIT)
  x-operator: institution
  description: >-
    Harvard University Information Technology's central catalog of administrative APIs - Courses, Person
    Data Service, Library Catalog, Dining, HR Departments, Zoom, Emailer and Generative AI. The portal
    software is a Google Apigee developer portal, but the APIs it fronts are Harvard-built and run on
    Harvard's gateway, so the surface is institution, not tenant. It is however completely closed to an
    outside developer: the catalog itself, every base URL and every credential require HarvardKey login,
    application registration and a per-API access grant. Anonymous requests to the portal and to every
    catalog data path return a 2KB Angular shell, so not one administrative API contract could be read.
