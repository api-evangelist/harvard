  x-operator: tenant
  x-tenant-of: Figshare (Digital Science)
  description: >-
    harvard.figshare.com is a Figshare institutional tenancy - the host CNAMEs directly to figshare.com.
    This is precisely the surface that produced the misattribution this pipeline exists to prevent: in
    the June 2026 cohort a single api.figshare.com contract was saved into 25 institutions' repos and
    gave eight of them an identical agent-readiness of 38.9. Harvard's tenancy is recorded here as a relationship
    and nothing more. No Figshare contract is stored under this slug, and none should ever be re-added.
  humanURL: https://harvard.figshare.com/
