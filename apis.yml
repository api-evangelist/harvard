- aid: harvard:identity-federation
  name: Harvard University Shibboleth Identity Provider (InCommon)
  x-operator: institution
  description: >-
    Harvard's SAML 2.0 identity provider, entityID https://fed.huit.harvard.edu/idp/shibboleth, registered
    in the InCommon federation and reachable as signed machine-readable metadata through the InCommon
    metadata query service. The entity carries REFEDS SIRTFI assurance certification and the REFEDS Research
    and Scholarship entity category; OrganizationName is "Harvard College" and mdui:DisplayName is "Harvard
    University". This is the authentication authority behind HarvardKey and therefore behind every gated
    Harvard API, and it is institution-operated by definition - a federation IdP cannot be outsourced
    without changing the entityID. Almost never catalogued for any institution; it is the most unambiguously
    Harvard-owned machine-readable artifact in this profile.
  humanURL: https://incommon.org/federation/
  baseURL: https://mdq.incommon.org/entities/https%3A%2F%2Ffed.huit.harvard.edu%2Fidp%2Fshibboleth
