- aid: harvard:librarycloud
  name: Harvard Library LibraryCloud API (Open Metadata)
  x-operator: institution
  description: >-
    Open metadata hub aggregating Harvard bibliographic metadata (12.7M+ bib records, image records, ArchivesSpace
