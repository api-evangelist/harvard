openapi: 3.2.0
info:
  title: Dataverse Mydata API
  description: Open source research data repository software.
  version: 6.10.1
tags:
- name: Mydata
paths:
  /mydata/retrieve:
    get:
      operationId: DataRetrieverAPI_retrieveMyDataAsJsonString
      parameters:
      - name: dataset_valid
        in: query
        schema:
          type: array
          items:
            type: boolean
      - name: dvobject_types
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DType'
      - name: filter_validities
        in: query
        schema:
          type: boolean
      - name: fq
        in: query
        schema:
          type: array
          items:
            type: string
      - name: metadata_fields
        in: query
        schema:
          type: array
          items:
            type: string
      - name: mydata_search_term
        in: query
        schema:
          type: string
      - name: order
        in: query
        schema:
          type: string
      - name: published_states
        in: query
        schema:
          type: array
          items:
            type: string
      - name: role_ids
        in: query
        schema:
          type: array
          items:
            format: int64
            type: integer
      - name: selected_page
        in: query
        schema:
          format: int32
          type: integer
      - name: show_collections
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
      - name: userIdentifier
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
      tags:
      - Mydata
      summary: Data retriever API retrieve my data as json string
      x-summary-source: derived
  /mydata/retrieve/collectionList:
    get:
      operationId: DataRetrieverAPI_retrieveMyCollectionList
      parameters:
      - name: userIdentifier
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Mydata
      summary: Data retriever API retrieve my collection list
      x-summary-source: derived
components:
  schemas:
    DType:
      enum:
      - Dataverse
      - Dataset
      - DataFile
      type: string
